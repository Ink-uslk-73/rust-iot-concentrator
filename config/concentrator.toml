[general]
name = "concentrator-01"
version = "4.0.0"
log_dir = "./logs"
dump_dir = "/var/crash/concentrator"

[domain.hard]
enabled = true
sla_ms = 10
heartbeat_ms = 10
protocols = ["modbus", "opcua", "profinet", "etherip", "can"]

[domain.soft]
enabled = true
sla_ms = 100
heartbeat_ms = 100
protocols = ["matter", "zigbee", "thread", "ble"]

[domain.life]
enabled = true
sla_ms = 1000
heartbeat_ms = 1000
protocols = ["mqtt", "http", "terminal", "polling"]

[domain.storage]
enabled = true
timescale_url = "postgres://concentrator@localhost:5432/telemetry"
loki_url = "http://localhost:3100"
retention_days = 90

[mode]
default = "all"
manual_switch = true

[balancer]
high_threshold = 0.70
critical_threshold = 0.90
recover_threshold = 0.40
hysteresis_ticks = 5
per_node = true

[watchdog]
hard_timeout_ms = 100
soft_timeout_ms = 1000
life_timeout_ms = 5000
storage_timeout_ms = 10000
check_interval_ms = 500

[bus]
signals_capacity = 256
telemetry_capacity = 4096
status_capacity = 128
diagnostics_capacity = 128
hard_queue_type = "crossbeam"

[gateway]
dashboard_addr = "0.0.0.0:8443"
terminal_addr = "0.0.0.0:8444"
tls_cert = "certs/server.crt"
tls_key = "certs/server.key"
ca_cert = "certs/ca.crt"
require_mtls = true
ui_embed = true

[metrics]
collect_interval_ms = 1000
cpu_source = "ebpf"
disk_devices = ["/dev/sda", "/dev/sdb"]
push_interval_ms = 1000
# --- Modbus paths (production vs emulation) ---
[modbus]
mode = "emulation"

[modbus.production]
config_path = "/var/thingspro/data/config.json"
registers_path = "/var/thingspro/data/registers.json"

[modbus.emulation]
config_path = "emulation/aig-502/config.json"
registers_path = "emulation/aig-502/registers.json"
# --- Redis hot-path cache (optional) ---
[cache]
enabled = false
url = "redis://127.0.0.1:6379"
ttl_sec = 60
max_ram_pct = 1
flush_interval_sec = 60
raw_path = "storage/raw/telemetry.cbor"
# --- Transport (NUMA-aware) ---
[transport]
# kind = "shmem" | "vsock" | "nop"
kind = "nop"
shmem_path = "/dev/shm/concentrator.shm"
vsock_cid = 2
vsock_port = 5000
# --- API (dashboard + REST) ---
[api]
addr = "127.0.0.1:1967"